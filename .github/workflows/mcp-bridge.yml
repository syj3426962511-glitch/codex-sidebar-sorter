name: MCP desktop bridge acceptance
on:
  workflow_dispatch:
    inputs:
      cloud_login:
        type: boolean
        default: false
        description: Issue a one-time device code and wait for the owner to authorize cloud acceptance
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent cloud diagnostics
        run: npm install --prefix "$RUNNER_TEMP/sorter-test-tools" --no-audit --no-fund playwright
      - name: Install the unmodified official Mac desktop
        run: |
          curl --fail --location --retry 2 --max-time 240 https://persistent.oaistatic.com/codex-app-prod/Codex.dmg -o "$RUNNER_TEMP/sorter-mcp.dmg"
          mkdir -p "$RUNNER_TEMP/sorter-mcp-mount"
          hdiutil attach "$RUNNER_TEMP/sorter-mcp.dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/sorter-mcp-mount"
          app=$(find "$RUNNER_TEMP/sorter-mcp-mount" -maxdepth 1 -name '*.app' -print -quit)
          ditto "$app" "$RUNNER_TEMP/SorterMcpOfficial.app"
          hdiutil detach "$RUNNER_TEMP/sorter-mcp-mount"
          codesign --verify --deep --strict "$RUNNER_TEMP/SorterMcpOfficial.app"
      - name: Issue the official cloud-only device authorization
        if: inputs.cloud_login
        run: python tests/CloudDeviceLogin.py start "$RUNNER_TEMP/SorterMcpOfficial.app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS/codex"
      - uses: actions/upload-artifact@v4
        if: inputs.cloud_login
        with:
          name: mcp-login-macos
          path: artifacts/login/public-login.json
          retention-days: 1
      - name: Wait for the owner to complete device authorization
        if: inputs.cloud_login
        run: python tests/CloudDeviceLogin.py wait
      - name: Verify desktop-owned MCP process authorization
        run: node tests/McpCloudAcceptance.mjs "$RUNNER_TEMP/SorterMcpOfficial.app" "$(command -v python)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-bridge-macos
          path: artifacts/mcp/*

