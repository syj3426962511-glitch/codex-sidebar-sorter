name: Standalone cloud validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Exercise production ordering, localization, settings, history and native frames
        run: dotnet run --project tests/CoreTests.csproj --configuration Release -- src artifacts/core-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-${{ matrix.os }}
          path: artifacts/core-results.json
  windows:
    needs: core
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build the self-contained Windows application
        shell: pwsh
        run: |
          dotnet publish src/SidebarSorter.csproj --configuration Release --output artifacts/windows
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed.' }
          & ./src/Background/构建后台.ps1 -OutputDirectory "$PWD/artifacts/windows" -BuildDirectory "$env:RUNNER_TEMP/sidebar-sorter-native"
      - name: Install the cloud-only installer compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Render and exercise the bilingual application with 30 projects and 360 chats
        shell: pwsh
        run: |
          dotnet run --project tests/WindowsUiTests.csproj --configuration Release -- artifacts/ui
          if ($LASTEXITCODE -ne 0) { throw 'Windows UI acceptance failed.' }
      - name: Build the candidate installer
        shell: pwsh
        run: |
          $compiler = Get-ChildItem 'C:/Program Files (x86)/Inno Setup */ISCC.exe' | Select-Object -Last 1
          & $compiler.FullName packaging/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
      - name: Accept installation, running upgrade, uninstall and lightweight background
        shell: pwsh
        run: |
          & ./tests/InstallerAcceptance.ps1 -InstallerPath "$PWD/artifacts/installer/CodexSidebarSorter-1.3.0-Setup.exe" -OutputDirectory "$PWD/artifacts/installed"
          if ($LASTEXITCODE -ne 0) { throw 'Installed application acceptance failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-candidate
          path: |
            artifacts/installer/*.exe
            artifacts/ui/*
            artifacts/installed/*
