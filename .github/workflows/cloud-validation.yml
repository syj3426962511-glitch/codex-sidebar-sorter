name: Standalone cloud validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Exercise production ordering, localization, settings, history and native frames
        run: dotnet run --project tests/CoreTests.csproj --configuration Release -- src artifacts/core-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-${{ matrix.os }}
          path: artifacts/core-results.json
