name: Independent native endpoint acceptance
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Native platform to exercise
        default: both
        options: [both, macos, linux]
permissions:
  contents: read
jobs:
  macos:
    if: inputs.platform != 'linux'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish the independent self-contained protocol probe
        run: dotnet publish tests/NativeEndpointProbe.csproj -c Release -r osx-arm64 --self-contained true -o artifacts/probe
      - name: Install the unmodified official Mac client in the cloud
        run: |
          curl --fail --location --retry 2 --max-time 300 https://persistent.oaistatic.com/codex-app-prod/Codex.dmg -o "$RUNNER_TEMP/Codex.dmg"
          mkdir -p "$RUNNER_TEMP/codex-mount"
          hdiutil attach "$RUNNER_TEMP/Codex.dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/codex-mount"
          app=$(find "$RUNNER_TEMP/codex-mount" -maxdepth 1 -name '*.app' -print -quit)
          ditto "$app" "$RUNNER_TEMP/OfficialCodex.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/OfficialCodex.app"
          open -na "$RUNNER_TEMP/OfficialCodex.app"
      - name: Verify native catalog access from the standalone program
        id: standalone
        continue-on-error: true
        run: |
          for attempt in $(seq 1 60); do
            if find /tmp/codex-app-tools -type s -name '*.sock' -print -quit 2>/dev/null | grep -q .; then break; fi
            sleep 1
          done
          mkdir -p artifacts/native
          screencapture -x artifacts/native/official-client-macos.png
          artifacts/probe/NativeEndpointProbe artifacts/native/native-macos.json
      - name: Check the signed standard .NET host and collect native authorization diagnostics
        if: always()
        continue-on-error: true
        run: |
          codesign -dv --verbose=4 artifacts/probe/NativeEndpointProbe 2> artifacts/native/probe-signature.txt || true
          codesign -dv --verbose=4 "$DOTNET_ROOT/dotnet" 2> artifacts/native/dotnet-signature.txt || true
          if [ '${{ steps.standalone.outcome }}' != 'success' ]; then
            dotnet artifacts/probe/NativeEndpointProbe.dll artifacts/native/native-macos-dotnet-host.json || true
          fi
          python3 - <<'PY'
          import pathlib,re
          roots=[pathlib.Path.home()/'Library/Logs',pathlib.Path.home()/'Library/Application Support/Codex/logs',pathlib.Path.home()/'Library/Application Support/ChatGPT/logs']
          found=[]
          for root in roots:
              if not root.exists(): continue
              for file in root.rglob('*'):
                  if not file.is_file() or file.stat().st_size>20_000_000: continue
                  try:
                      for line in file.read_text(errors='ignore').splitlines():
                          if re.search(r'dynamic_app_tools_peer_authorization_failed|dynamic_app_tools_peer_rejected|native pipe peer authorization|dynamic_app_tools_listening',line): found.append(line[:2000])
                  except OSError: pass
          pathlib.Path('artifacts/native/native-authorization.log').write_text('\n'.join(found[-60:]))
          PY
          if [ '${{ steps.standalone.outcome }}' != 'success' ]; then exit 1; fi
      - name: Verify the official signed CLI socket transport
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/sorter-relay"
          curl --fail --location --retry 2 --max-time 180 https://github.com/openai/codex/releases/download/rust-v0.169.0/codex-aarch64-apple-darwin.tar.gz -o "$RUNNER_TEMP/sorter-relay/cli.tar.gz"
          tar -xzf "$RUNNER_TEMP/sorter-relay/cli.tar.gz" -C "$RUNNER_TEMP/sorter-relay"
          cli="$RUNNER_TEMP/sorter-relay/codex-aarch64-apple-darwin"
          codesign --verify --strict "$cli"
          codesign -dv --verbose=4 "$cli" 2> artifacts/native/relay-signature.txt
          python3 tests/mac_relay_probe.py "$cli" artifacts/native/native-macos-relay.json
      - name: Inspect the shipping transport contract and bundled CLI
        if: always()
        run: |
          python3 tests/read_mac_transport.py "$RUNNER_TEMP/OfficialCodex.app/Contents/Resources/app.asar" artifacts/native/shipping-transport.json
          find "$RUNNER_TEMP/OfficialCodex.app/Contents/Resources" -maxdepth 4 -type f \( -name '*codex*' -o -name '*peer*' \) > artifacts/native/bundled-transport-paths.txt
          bundled="$RUNNER_TEMP/OfficialCodex.app/Contents/Resources/codex"
          if [ -x "$bundled" ]; then
            cp "$bundled" "$RUNNER_TEMP/sorter-relay/bundled-codex"
            codesign --verify --strict "$RUNNER_TEMP/sorter-relay/bundled-codex"
            codesign -dv --verbose=4 "$RUNNER_TEMP/sorter-relay/bundled-codex" 2> artifacts/native/bundled-cli-signature.txt
            python3 tests/mac_relay_probe.py "$RUNNER_TEMP/sorter-relay/bundled-codex" artifacts/native/native-macos-bundled-relay.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-native-macos
          path: artifacts/native/*
  linux:
    if: inputs.platform != 'macos'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish the independent self-contained protocol probe
        run: dotnet publish tests/NativeEndpointProbe.csproj -c Release -r linux-x64 --self-contained true -o artifacts/probe
      - name: Install the official Linux desktop package in the cloud
        run: |
          curl --fail --location --retry 2 --max-time 300 https://persistent.oaistatic.com/codex-app-prod/linux/deb/latest/chatgpt_amd64.deb -o "$RUNNER_TEMP/chatgpt.deb"
          sudo apt-get update -qq
          sudo apt-get install -y "$RUNNER_TEMP/chatgpt.deb" xvfb scrot
      - name: Verify native catalog access from the standalone program
        run: |
          mkdir -p artifacts/native
          xvfb-run -a -s '-screen 0 1400x900x24' bash -c '
            chatgpt > artifacts/native/official-client-linux.log 2>&1 &
            client_pid=$!
            for attempt in $(seq 1 60); do
              if find "/tmp/codex-app-tools-$(id -u)" -type s -name "*.sock" -print -quit 2>/dev/null | grep -q .; then break; fi
              sleep 1
            done
            scrot artifacts/native/official-client-linux.png
            artifacts/probe/NativeEndpointProbe artifacts/native/native-linux.json
            probe_exit=$?
            kill -TERM "$client_pid" 2>/dev/null || true
            exit "$probe_exit"
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-native-linux
          path: artifacts/native/*
