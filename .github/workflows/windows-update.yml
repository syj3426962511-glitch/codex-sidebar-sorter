name: Windows installed desktop upgrade
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish the self-contained production entry point
        run: dotnet publish desktop/SidebarSorter.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows
      - name: Build the native notification menu
        run: ./desktop/NativeTray/build-windows.ps1 -OutputDirectory artifacts/windows
      - name: Install the cloud-only setup compiler
        run: choco install innosetup --yes --no-progress
      - name: Download the preceding public installer for upgrade acceptance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/previous -Force | Out-Null
          curl.exe --fail --location --retry 2 --max-time 240 -o artifacts/previous/previous-setup.exe https://github.com/syj3426962511-glitch/codex-sidebar-sorter/releases/download/v1.4.3-preview/CodexSidebarSorter-1.4.3-Windows-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Preceding installer download failed.' }
      - name: Compile the current Windows installer
        shell: pwsh
        run: |
          $version = ([xml](Get-Content desktop/SidebarSorter.Desktop.csproj -Raw)).SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          $compiler = Get-ChildItem 'C:/Program Files (x86)/Inno Setup */ISCC.exe' | Select-Object -Last 1
          & $compiler.FullName "/DProductVersion=$version" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
      - name: Verify the installed production program and running upgrade
        shell: pwsh
        run: |
          $candidate = Get-ChildItem artifacts/installer/CodexSidebarSorter-*-Windows-Setup.exe
          dotnet run --project tests/InstalledDesktopAcceptance.csproj -c Release -- $candidate.FullName artifacts/installed artifacts/previous/previous-setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-upgrade
          path: |
            artifacts/installer/CodexSidebarSorter-*-Windows-Setup.exe
            artifacts/installed/*
